<main class="page">
  <div class="wrap">
    <div class="page-head">
      <p class="kick">Contact</p>
      <h1>Say hello.</h1>
      <p class="lede">Send us a note for questions, feedback, or help.</p>
    </div>

    <form id="contact-form" class="contact-form" novalidate>
      <fieldset id="contact-fields">
        <div class="field">
          <label for="cname">Name</label>
          <input id="cname" name="name" type="text" placeholder="Your name" autocomplete="name" required>
        </div>
        <div class="field">
          <label for="cemail">Email</label>
          <input id="cemail" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="cmsg">Message</label>
          <textarea id="cmsg" name="message" placeholder="How can we help?" required></textarea>
        </div>
        <div class="hp-field" aria-hidden="true">
          <label for="cwebsite">Website</label>
          <input id="cwebsite" name="website" type="text" tabindex="-1" autocomplete="off">
        </div>
      </fieldset>
      <button type="submit" id="contact-submit" class="pill">Send message</button>
      <p class="meta" id="contact-status" aria-live="polite">We&rsquo;ll get back to you as soon as we can.</p>
    </form>
    <div id="contact-done" class="contact-done" role="status" hidden>
      <svg class="contact-done-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
      <p>Thank you — we&rsquo;ll get back to you soon.</p>
    </div>
  </div>
</main>

<script>
(function(){
  var CONTACT_ENDPOINT = 'https://contact.soeasy.ltd/contact';
  var form = document.getElementById('contact-form');
  if(!form) return;
  var status = document.getElementById('contact-status');
  var submitBtn = document.getElementById('contact-submit');
  var fields = document.getElementById('contact-fields');
  var done = document.getElementById('contact-done');
  var defaultStatus = status.textContent;

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if(!form.checkValidity()){
      status.textContent = 'Please fill out all required fields.';
      return;
    }

    var data = {
      name: form.elements.name.value.trim(),
      email: form.elements.email.value.trim(),
      message: form.elements.message.value.trim(),
      website: form.elements.website.value,
    };

    fields.disabled = true;
    submitBtn.disabled = true;
    status.textContent = 'Sending…';

    fetch(CONTACT_ENDPOINT, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(data),
    }).then(function (res) {
      if(!res.ok) throw new Error('Request failed');
      form.hidden = true;
      done.hidden = false;
    }).catch(function () {
      status.textContent = 'Something went wrong. Please try again.';
      fields.disabled = false;
      submitBtn.disabled = false;
    });
  });
})();
</script>
